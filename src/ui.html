<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리스 승인함</title>
<style>
  :root {
    --bg: #ffffff; --canvas: #f6f8fa; --border: #d0d7de;
    --fg: #1f2328; --muted: #656d76; --faint: #8c959f;
    --accent: #0969da; --ok: #1a7f37; --danger: #d1242f; --warn: #9a6700;
    --add-bg: #dafbe1; --add-ln: #aceebb;
    --del-bg: #ffebe9; --del-ln: #ffcecb;
    --hunk-bg: #ddf4ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--canvas);
  }
  header h1 { font-size: 16px; margin: 0 4px 0 0; font-weight: 600; }
  .branch {
    font-size: 12px; font-family: var(--mono); color: var(--fg);
    border: 1px solid var(--border); border-radius: 2em;
    background: var(--bg); padding: 1px 10px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .btn {
    font-size: 14px; font-weight: 500; padding: 5px 16px; min-height: 32px;
    background: var(--canvas); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #eef1f4; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: #1f883d; border-color: #1f883d; color: #ffffff; }
  .btn-primary:hover { background: #1a7f37; }
  .btn-danger { background: #cf222e; border-color: #cf222e; color: #ffffff; }
  .btn-danger:hover { background: #a40e26; }
  .btn[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { flex: 0 0 auto; }
  #headActions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; flex: 0 0 auto;
    background: var(--canvas); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  .iconbtn:hover { background: #eef1f4; color: var(--fg); }
  .layout { flex: 1 1 auto; display: flex; min-height: 0; }
  /* LNB: 고정, 접기 없음 */
  #lnb {
    flex: 0 0 260px; width: 260px; border-right: 1px solid var(--border);
    background: var(--bg); overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column;
  }
  .lnbhead {
    padding: 10px 16px; font-size: 12px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  /* 케이스 패널: 가로 접기 */
  #panel {
    flex: 0 0 320px; width: 320px; border-right: 1px solid var(--border);
    background: var(--bg); min-height: 0; display: flex; align-items: stretch;
  }
  #panel[data-collapsed="true"] { flex-basis: 40px; width: 40px; }
  #panelMain {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0;
  }
  #panel[data-collapsed="true"] #panelMain { display: none; }
  #panelEdge {
    flex: 0 0 40px; width: 40px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; padding: 8px 0;
    border-left: 1px solid var(--border); background: var(--canvas);
  }
  #panelVLabel {
    writing-mode: vertical-rl; font-size: 12px; color: var(--muted);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  #panel[data-collapsed="true"] #panelVLabel { display: block; }
  #panelVLabel[hidden] { display: none; }
  #tabs { display: flex; gap: 4px; padding: 10px 12px 8px; flex: 0 0 auto; }
  #tabs button {
    flex: 1 1 auto; font-size: 13px; padding: 5px 8px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  #tabs button[aria-selected="true"] {
    background: var(--canvas); color: var(--fg); font-weight: 600;
    border-color: var(--border);
  }
  #highlightbar {
    display: flex; gap: 6px; align-items: center; margin: 0 12px 8px;
    font-size: 12px; color: var(--muted); flex: 0 0 auto;
  }
  #highlightbar[hidden] { display: none; }
  #highlightbar .hpath {
    flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #highlightbar .hpath b { font-family: var(--mono); font-weight: 600; color: var(--fg); }
  #list { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
  .case {
    display: block; width: 100%; text-align: left; font-size: 13px;
    background: transparent; color: var(--fg); border: none;
    border-bottom: 1px solid var(--border); padding: 8px 16px; cursor: pointer;
  }
  .case:hover { background: var(--canvas); }
  .case[aria-current="true"] { background: #ddf4ff; border-left: 3px solid var(--accent); padding-left: 13px; }
  .case[data-highlight="true"] { background: #fff8c5; }
  .case[data-highlight="true"][aria-current="true"] { background: #ddf4ff; }
  .case .cid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .case .req { margin: 2px 0 6px; overflow-wrap: break-word; }
  .case .meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 500;
    border: 1px solid var(--border); border-radius: 2em; padding: 1px 8px; white-space: nowrap;
    background: var(--canvas); color: var(--fg);
  }
  .badge.size { background: #fff8c5; border-color: #d4a72c; color: #7d4e00; }
  .badge.protected_path { background: #fbefff; border-color: #d2a8ff; color: #6639ba; }
  .badge.secret { background: #ffebe9; border-color: #ff8182; color: #a40e26; }
  .badge.test_failed { background: #ddf4ff; border-color: #54aeff; color: #0550ae; }
  .badge.fadded { background: var(--add-bg); border-color: #4ac26b; color: var(--ok); }
  .badge.fmodified { background: var(--canvas); border-color: var(--border); color: var(--fg); }
  .badge.fdeleted { background: var(--del-bg); border-color: #ff8182; color: var(--danger); }
  .badge.frenamed { background: var(--canvas); border-color: var(--border); color: var(--muted); }
  .badge.draft-approve { background: var(--add-bg); border-color: #4ac26b; color: var(--ok); font-weight: 600; }
  .badge.draft-reject { background: var(--del-bg); border-color: #ff8182; color: var(--danger); font-weight: 600; }
  .risk { font-variant-numeric: tabular-nums; }
  .empty { padding: 16px; color: var(--faint); font-size: 13px; }
  /* 워크스페이스 트리 */
  #wtree { padding: 8px; font-size: 13px; }
  .tdir { margin: 0; }
  .dirsum {
    display: flex; width: 100%; gap: 6px; align-items: center; text-align: left;
    cursor: pointer; padding: 4px 6px; border: none; border-radius: 6px;
    background: transparent; color: var(--fg); font-weight: 600; font-size: 13px;
  }
  .dirsum:hover { background: var(--canvas); }
  .tinner { padding-left: 18px; }
  .tfile {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--fg); border: none; border-radius: 6px;
    padding: 4px 6px; cursor: pointer; font-size: 13px;
  }
  .tfile:hover { background: var(--canvas); }
  .tfile[aria-current="true"] { background: #ddf4ff; }
  .tfile[data-highlight="true"] { background: #fff8c5; }
  .tfile[data-highlight="true"][aria-current="true"] { background: #ddf4ff; }
  .tfile .trow1 { display: flex; gap: 6px; align-items: center; font-family: var(--mono); }
  .tfile svg { flex: 0 0 auto; color: var(--muted); }
  .tfile .tname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tfile .tlast {
    margin: 2px 0 0 22px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .newfile {
    font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ok); border: 1px solid #4ac26b; border-radius: 2em; padding: 0 6px; white-space: nowrap;
  }
  .pcase {
    display: inline-flex; gap: 3px; align-items: center;
    font-size: 11px; color: var(--warn); white-space: nowrap;
    border: 1px solid #d4a72c; background: #fff8c5; border-radius: 2em; padding: 0 6px;
  }
  .pcase .dot { width: 7px; height: 7px; border-radius: 50%; background: #d4a72c; display: inline-block; }
  .hdot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #8c959f; flex: 0 0 auto;
  }
  /* 상세 */
  #detail { flex: 1 1 auto; min-width: 0; overflow-y: auto; min-height: 0; }
  .decbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .decbar-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .decbar-top h2 { font-size: 15px; margin: 0; font-family: var(--mono); font-weight: 600; }
  .decbar .req1, .decbar .eff {
    margin: 4px 0 0; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .decbar .eff { color: var(--muted); font-size: 12px; }
  .decbar .lastcommit { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .decbar .lastcommit .sha { font-family: var(--mono); }
  .commitmsg {
    margin: 8px 0 0; font-family: var(--mono); font-size: 12px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--canvas);
    padding: 8px 10px; white-space: pre-wrap; overflow-wrap: break-word;
  }
  .commitmsg .cmlabel { display: block; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .commitmsg .cmfirst { display: block; font-weight: 600; }
  .actrow { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  #note {
    flex: 1 1 auto; min-width: 0; font-size: 14px; padding: 5px 12px; min-height: 32px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg);
  }
  #err { margin-top: 8px; font-size: 13px; color: var(--danger); min-height: 1.5em; }
  #err:empty { display: none; }
  #draftline { margin-top: 8px; font-size: 13px; color: var(--muted); }
  #draftline:empty { display: none; }
  .decided { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .decided .sha { font-family: var(--mono); font-size: 12px; }
  .detailbody { padding: 4px 16px 16px; }
  .detailbody section { margin: 12px 0; }
  .detailbody h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .detailbody p { margin: 0 0 4px; overflow-wrap: break-word; }
  ul.rationale { margin: 0; padding-left: 20px; }
  .filewrap { display: flex; gap: 16px; align-items: flex-start; }
  .tree { flex: 0 0 220px; min-width: 0; font-size: 12px; }
  .tree details { margin-bottom: 4px; }
  .tree summary { cursor: pointer; color: var(--muted); font-family: var(--mono); list-style: none; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree ul { list-style: none; margin: 4px 0; padding-left: 12px; }
  .tree li { margin: 2px 0; }
  .tree button {
    display: block; width: 100%; text-align: left; font-size: 12px;
    background: transparent; color: var(--fg); border: none; border-radius: 6px;
    padding: 4px 6px; cursor: pointer; font-family: var(--mono);
    overflow-wrap: break-word;
  }
  .tree button:hover { background: var(--canvas); }
  .tree button[aria-current="true"] { background: #ddf4ff; }
  .tree .counts { color: var(--faint); font-size: 11px; }
  .diffs { flex: 1 1 auto; min-width: 0; }
  details.filediff { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; }
  details.filediff > summary {
    cursor: pointer; padding: 8px 10px; font-family: var(--mono); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center;
    background: var(--canvas); border-radius: 6px; list-style: none;
  }
  details.filediff[open] > summary { border-radius: 6px 6px 0 0; border-bottom: 1px solid var(--border); }
  details.filediff > summary::-webkit-details-marker { display: none; }
  details.filediff .fchev { color: var(--muted); flex: 0 0 auto; }
  details.filediff:not([open]) .fchev { transform: rotate(-90deg); }
  .fpath { font-weight: 600; overflow-wrap: break-word; }
  .pm { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pm .p { color: var(--ok); }
  .pm .m { color: var(--danger); }
  .db { display: inline-flex; gap: 1px; }
  .db .cell { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--border); background: #eaeef2; }
  .db .cell.g { background: #2da44e; border-color: #2da44e; }
  .db .cell.r { background: #f85149; border-color: #f85149; }
  table.difftable { border-collapse: collapse; width: 100%; }
  pre.diff {
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    background: var(--bg); margin: 0; padding: 0; overflow-x: auto;
  }
  table.difftable td { padding: 0 10px; vertical-align: top; white-space: pre; }
  table.difftable td.ln {
    width: 1%; min-width: 40px; text-align: right; color: var(--muted);
    background: var(--bg); user-select: none;
  }
  table.difftable td.code { width: 98%; overflow-wrap: break-word; }
  table.difftable tr.hunk td { background: var(--hunk-bg); color: #57606a; }
  table.difftable tr.add td { background: var(--add-bg); }
  table.difftable tr.add td.ln { background: var(--add-ln); }
  table.difftable tr.del td { background: var(--del-bg); }
  table.difftable tr.del td.ln { background: var(--del-ln); }
  .histrow {
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; width: 100%;
    text-align: left; padding: 8px 16px; border: none; border-bottom: 1px solid var(--border);
    font-size: 13px; background: transparent; color: var(--fg); cursor: pointer;
  }
  .histrow:hover { background: var(--canvas); }
  .histrow[aria-current="true"] { background: #ddf4ff; border-left: 3px solid var(--accent); padding-left: 13px; }
  .histrow[data-highlight="true"] { background: #fff8c5; }
  .histrow[data-highlight="true"][aria-current="true"] { background: #ddf4ff; }
  .histrow .cid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .histrow .sha { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status { font-weight: 600; }
  .status.pending { color: var(--warn); }
  .status.auto_applied { color: var(--ok); }
  .status.approved_applied { color: var(--accent); }
  .status.rejected { color: var(--danger); }
  .status.not_run { color: var(--faint); }
  /* 제출 모달 */
  #modalOverlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(31, 35, 40, 0.5);
    display: flex; align-items: center; justify-content: center;
  }
  #modalOverlay[hidden] { display: none; }
  .submitmodal {
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    width: min(560px, calc(100vw - 48px)); max-height: calc(100vh - 96px);
    display: flex; flex-direction: column;
  }
  .submitmodal h2 { font-size: 16px; margin: 0; padding: 16px 16px 0; }
  .submitmodal .mbody { padding: 8px 16px; overflow-y: auto; }
  .submitmodal .mbody h3 { font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .submitmodal .mitem { font-size: 13px; margin: 4px 0; overflow-wrap: break-word; }
  .submitmodal .mitem .cid { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .submitmodal .mitem .cmeta { color: var(--muted); font-size: 12px; }
  .submitmodal .warn { font-size: 13px; font-weight: 600; margin: 12px 0 0; }
  .submitmodal .mfoot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px 16px; }
  .submitmodal .mresult { font-size: 13px; margin: 4px 0; }
  .submitmodal .mresult .ok { color: var(--ok); font-weight: 600; }
  .submitmodal .mresult .fail { color: var(--danger); font-weight: 600; }
  @media (max-width: 899px) {
    #lnb { flex-basis: 200px; width: 200px; }
    #panel { flex-basis: 260px; width: 260px; }
    .filewrap { flex-direction: column; }
    .tree { flex: 1 1 auto; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>sandbox</h1>
  <span class="branch">main</span>
  <div class="stats" id="stats" aria-live="polite"></div>
  <div id="headActions">
    <button id="submitBtn" class="btn btn-primary" type="button" data-role="submit-decisions" aria-label="결정 제출" disabled>결정 제출 (0)</button>
    <button id="runAll" class="btn" type="button" aria-label="새 산출물 가져오기"></button>
  </div>
</header>
<div class="layout">
  <aside id="lnb" aria-label="워크스페이스">
    <div class="lnbhead">워크스페이스</div>
    <div id="wtree" data-role="workspace-tree"></div>
  </aside>
  <section id="panel" data-role="case-panel" data-collapsed="false" aria-label="케이스 패널">
    <div id="panelMain">
      <div id="tabs" role="tablist" aria-label="보기 전환">
        <button id="tabPending" role="tab" aria-selected="true" type="button" data-role="tab-pending">대기 0</button>
        <button id="tabHistory" role="tab" aria-selected="false" type="button" data-role="tab-history">처리 이력 0</button>
      </div>
      <div id="highlightbar" data-role="highlight-bar" hidden></div>
      <div id="list" role="tabpanel" aria-label="목록" data-role="case-list"></div>
    </div>
    <div id="panelEdge">
      <button id="panelToggle" class="iconbtn" type="button" data-role="panel-toggle" aria-label="패널 접기"></button>
      <div id="panelVLabel" hidden></div>
    </div>
  </section>
  <main id="detail" role="tabpanel" aria-label="상세"></main>
</div>
<div id="modalOverlay" hidden></div>

  var SIGNAL_LABEL = {
    size: "크기 초과",
    protected_path: "보호 경로",
    secret: "비밀 의심",
    test_failed: "테스트 실패"
  };
  var STATUS_LABEL = {
    pending: "대기",
    auto_applied: "자동 적용",
    approved_applied: "승인 적용",
    rejected: "반려",
    not_run: "미실행"
  };
  var FILE_STATUS_LABEL = {
    added: "새 파일",
    modified: "수정",
    deleted: "삭제",
    renamed: "이름 변경"
  };
  var EXPAND_LIMIT = 40;
  var DRAFT_KEY = "gate-drafts-v1";
  var PANEL_KEY = "gate-panel-v1";
  var RUNALL_DESC = "아직 게이트를 거치지 않은 에이전트 산출물을 게이트에 넣습니다. 멈춤 신호가 없으면 자동 반영, 있으면 대기로 들어갑니다";
  var RUNALL_EMPTY = "가져올 새 산출물이 없습니다";

  var listEl = document.getElementById("list");
  var detailEl = document.getElementById("detail");
  var statsEl = document.getElementById("stats");
  var runAllBtn = document.getElementById("runAll");

  var tabPending = document.getElementById("tabPending");
  var tabHistory = document.getElementById("tabHistory");
  var wtreeEl = document.getElementById("wtree");
  var highlightbarEl = document.getElementById("highlightbar");
  var panelEl = document.getElementById("panel");
  var panelToggle = document.getElementById("panelToggle");
  var panelVLabel = document.getElementById("panelVLabel");
  var modalOverlay = document.getElementById("modalOverlay");

  var state = {
    cases: [], stats: null, selected: null, view: "pending", busy: false,
    tree: [], highlight: null, selectedFiles: [], drafts: {},
    collapsedDirs: {}, collapsed: false, fileCommit: null, submitBusy: false
  };

  function esc(s) { return s === null || s === undefined ? "" : String(s); }

  function lsGet(k) {
    try { return window.localStorage.getItem(k); }
    catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { window.localStorage.setItem(k, v); }
    catch (e) { /* 저장 실패 시 무시 */ }
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function icon(name, cls) {
    if (typeof document.createElementNS === "function") {
      var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 16 16");
      s.setAttribute("width", "16");
      s.setAttribute("height", "16");
      s.setAttribute("aria-hidden", "true");
      if (cls) s.setAttribute("class", cls);
      var paths = ICON_PATHS[name] || [""];
      paths.forEach(function (d) {
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "currentColor");
        s.appendChild(p);
      });
      return s;
    }
    return el("span", "noicon " + (cls || ""), "");
  }

  function iconButton(label, name, id) {
    var b = el("button", "iconbtn", null);
    b.type = "button";
    if (id) b.id = id;
    b.setAttribute("aria-label", label);
    b.setAttribute("title", label);
    b.appendChild(icon(name));
    return b;
  }

  function badge(signal) {
    var b = el("span", "badge " + signal, SIGNAL_LABEL[signal] || signal);
    b.setAttribute("title", signal);
    return b;
  }

  function fileBadge(status) {
    var b = el("span", "badge f" + status, FILE_STATUS_LABEL[status] || status);
    b.setAttribute("title", status);
    return b;
  }

  function draftChip(kind) {
    var label = kind === "approve" ? "승인 예정" : "반려 예정";
    return el("span", "badge draft-" + kind, label);
  }

  function statusSpan(status) {
    return el("span", "status " + status, STATUS_LABEL[status] || status);
  }

  function riskText(risk) {
    return (risk === null || risk === undefined) ? "위험 점수 없음" : ("위험 점수 " + risk);
  }

  function api(path, opts) {
    return fetch(path, opts).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) {
          var err = new Error((body && body.error) || ("요청 실패 (상태 " + res.status + ")"));
          err.status = res.status;
          throw err;
        }
        return body;
      });
    }).catch(function (e) {
      if (e && e.status) throw e;
      throw new Error("서버에 연결할 수 없습니다");
    });
  }

  function renderStats() {
    statsEl.textContent = "";
    var s = state.stats;
    if (!s) { statsEl.appendChild(el("span", null, "통계 불러오는 중")); return; }
    var items = [
      ["자동", s.auto], ["대기", s.pending], ["승인", s.approved],
      ["반려", s.rejected], ["미실행", s.not_run], ["커밋", s.sandbox_commits]
    ];
    items.forEach(function (pair, i) {
      if (i > 0) statsEl.appendChild(el("span", null, "·"));
      var w = el("span", null, pair[0] + " ");
      w.appendChild(el("b", null, String(pair[1])));
      statsEl.appendChild(w);
    });
    renderRunAll();
  }

  function renderRunAll() {
    var s = state.stats;
    var empty = !s || s.not_run === 0;
    runAllBtn.disabled = state.busy || empty;
    runAllBtn.setAttribute("title", empty ? RUNALL_EMPTY : RUNALL_DESC);
  }

  function draftIds() {
    return Object.keys(state.drafts);
  }

  function pruneDrafts() {
    var pending = {};
    pendingCases().forEach(function (c) { pending[c.case_id] = true; });
    var changed = false;
    draftIds().forEach(function (id) {
      if (!pending[id]) { delete state.drafts[id]; changed = true; }
    });
    if (changed) persistDrafts();
  }

  function persistDrafts() {
    lsSet(DRAFT_KEY, JSON.stringify(state.drafts));
  }

  function loadDrafts() {
    var raw = lsGet(DRAFT_KEY);
    if (!raw) { state.drafts = {}; return; }
    try {
      var v = JSON.parse(raw);
      if (v && typeof v === "object") state.drafts = v;
      else state.drafts = {};
    } catch (e) { state.drafts = {}; }
  }

  function renderSubmitBtn() {
    var n = draftIds().length;
    submitBtn.textContent = "";
    submitBtn.appendChild(el("span", null, "결정 제출 (" + n + ")"));
    submitBtn.disabled = state.busy || state.submitBusy || n === 0;
  }

  function pendingCases() {
    return state.cases.filter(function (c) { return c.status === "pending"; });
  }
  function historyCases() {
    return state.cases.filter(function (c) {
      return c.status === "auto_applied" || c.status === "approved_applied" || c.status === "rejected";
    });
  }
  function caseById(id) {
    for (var i = 0; i < state.cases.length; i++) {
      if (state.cases[i].case_id === id) return state.cases[i];
    }
    return null;
  }

  function treeEntryFor(path) {
    for (var i = 0; i < state.tree.length; i++) {
      if (state.tree[i].path === path) return state.tree[i];
    }
    return null;
  }

  function highlightIds() {
    if (!state.highlight) return {};
    var entry = treeEntryFor(state.highlight);
    if (!entry) return {};
    var allow = {};
    ((entry.pending_cases) || []).concat((entry.history_cases) || []).forEach(function (id) {
      allow[id] = true;
    });
    return allow;
  }

  function highlightCount() {
    var allow = highlightIds();
    return Object.keys(allow).length;
  }

  function caseButton(c) {
    var b = el("button", "case", null);
    b.type = "button";
    b.setAttribute("data-role", "case-item");
    b.setAttribute("data-case", c.case_id);
    b.setAttribute("aria-current", state.selected === c.case_id ? "true" : "false");
    if (highlightIds()[c.case_id]) b.setAttribute("data-highlight", "true");
    var draft = state.drafts[c.case_id];
    if (draft) b.setAttribute("data-draft", draft.kind);
    b.appendChild(el("div", "cid", c.case_id));
    b.appendChild(el("div", "req", c.request));
    var meta = el("div", "meta", null);
    (c.stop_reasons || []).forEach(function (sig) { meta.appendChild(badge(sig)); });
    meta.appendChild(statusSpan(c.status));
    meta.appendChild(el("span", "risk", riskText(c.risk_score)));
    if (draft) meta.appendChild(draftChip(draft.kind));
    b.appendChild(meta);
    b.addEventListener("click", function () {
      state.fileCommit = null;
      selectCase(c.case_id);
    });
    return b;
  }

  function historyButton(c) {
    var b = el("button", "histrow", null);
    b.type = "button";
    b.setAttribute("data-role", "case-item");
    b.setAttribute("data-case", c.case_id);
    b.setAttribute("aria-current", state.selected === c.case_id ? "true" : "false");
    if (highlightIds()[c.case_id]) b.setAttribute("data-highlight", "true");
    b.appendChild(el("span", "cid", c.case_id));
    b.appendChild(statusSpan(c.status));
    b.appendChild(el("span", "sha", c.commit_sha ? ("커밋 " + c.commit_sha) : "커밋 없음"));
    b.addEventListener("click", function () {
      state.fileCommit = null;
      selectCase(c.case_id);
    });
    return b;
  }

  function renderHighlightbar() {
    highlightbarEl.textContent = "";
    if (!state.highlight) {
      highlightbarEl.setAttribute("hidden", "");
      return;
    }
    highlightbarEl.removeAttribute("hidden");
    var shortName = state.highlight.slice(state.highlight.lastIndexOf("/") + 1);
    var span = el("span", "hpath", null);
    span.appendChild(el("b", null, shortName));
    span.appendChild(el("span", null, " 관련 " + highlightCount() + "건 강조 중"));
    highlightbarEl.appendChild(span);
    var clear = iconButton("강조 해제", "xCircle", null);
    clear.addEventListener("click", function () {
      state.highlight = null;
      renderList();
      renderWorkspaceTree();
    });
    highlightbarEl.appendChild(clear);
  }

  function renderList() {
    listEl.textContent = "";
    renderHighlightbar();
    tabPending.textContent = "대기 " + pendingCases().length;
    tabHistory.textContent = "처리 이력 " + historyCases().length;
    var rows = state.view === "pending" ? pendingCases() : historyCases();
    if (rows.length === 0) {
      listEl.appendChild(el("div", "empty",
        state.view === "pending" ? "대기 중인 건이 없습니다" : "처리된 건이 없습니다"));
      return;
    }
    rows.forEach(function (c) {
      listEl.appendChild(state.view === "pending" ? caseButton(c) : historyButton(c));
    });
    if (state.highlight) {
      var first = listEl.querySelector('[data-highlight="true"]');
      if (first && first.scrollIntoView) first.scrollIntoView({ block: "nearest" });
    }
  }

  function lastCommitTitle(lc) {
    if (!lc) return "";
    var sha7 = String(lc.sha).slice(0, 7);
    return (lc.subject || "") + " · " + (lc.date || "") + " · " + sha7;
  }

  function renderWorkspaceTree() {
    if (!wtreeEl) return;
    wtreeEl.textContent = "";
    if (state.tree.length === 0) {
      wtreeEl.appendChild(el("div", "empty", "파일 목록을 불러오지 못했습니다"));
      return;
    }
    var root = { dirs: {}, files: [] };
    state.tree.forEach(function (e) {
      var parts = e.path.split("/");
      var node = root;
      for (var i = 0; i < parts.length - 1; i++) {
        if (!node.dirs[parts[i]]) node.dirs[parts[i]] = { dirs: {}, files: [] };
        node = node.dirs[parts[i]];
      }
      node.files.push(e);
    });
    renderTreeNode(wtreeEl, root, "");
  }

  function renderTreeNode(container, node, prefix) {
    var dirNames = Object.keys(node.dirs).sort();
    dirNames.forEach(function (name) {
      var full = prefix === "" ? name : prefix + "/" + name;
      var wrap = el("div", "tdir", null);
      var collapsed = !!state.collapsedDirs[full];
      var sum = el("button", "dirsum", null);
      sum.type = "button";
      sum.setAttribute("aria-expanded", collapsed ? "false" : "true");
      sum.appendChild(icon(collapsed ? "chevronRight" : "chevronDown"));
      sum.appendChild(icon(collapsed ? "dirClosed" : "dirOpen"));
      sum.appendChild(el("span", null, name));
      (function (p) {
        sum.addEventListener("click", function () {
          if (state.collapsedDirs[p]) delete state.collapsedDirs[p];
          else state.collapsedDirs[p] = true;
          renderWorkspaceTree();
        });
      })(full);
      wrap.appendChild(sum);
      if (!collapsed) {
        var inner = el("div", "tinner", null);
        renderTreeNode(inner, node.dirs[name], full);
        wrap.appendChild(inner);
      }
      container.appendChild(wrap);
    });
    var files = node.files.slice().sort(function (a, b) {
      return a.path < b.path ? -1 : (a.path > b.path ? 1 : 0);
    });
    files.forEach(function (f) {
      var b = el("button", "tfile", null);
      b.type = "button";
      b.setAttribute("data-role", "tree-file");
      b.setAttribute("data-path", f.path);
      b.setAttribute("title", f.path);
      b.setAttribute("aria-current", state.selectedFiles.indexOf(f.path) >= 0 ? "true" : "false");
      if (state.highlight === f.path) b.setAttribute("data-highlight", "true");
      var row1 = el("span", "trow1", null);
      row1.appendChild(icon("file"));
      var shortName = f.path.slice(f.path.lastIndexOf("/") + 1);
      row1.appendChild(el("span", "tname", shortName));
      if (!f.exists_on_main) row1.appendChild(el("span", "newfile", "새 파일"));
      if (f.pending_cases && f.pending_cases.length > 0) {
        var pb = el("span", "pcase", null);
        pb.setAttribute("title", f.pending_cases.join(", "));
        var dot = el("span", "dot", null);
        dot.setAttribute("aria-hidden", "true");
        pb.appendChild(dot);
        pb.appendChild(el("span", null, String(f.pending_cases.length)));
        row1.appendChild(pb);
      } else if (f.history_cases && f.history_cases.length > 0) {
        var hd = el("span", "hdot", null);
        hd.setAttribute("title", f.history_cases.join(", "));
        hd.setAttribute("aria-hidden", "true");
        row1.appendChild(hd);
      }
      b.appendChild(row1);
      if (f.last_commit && f.last_commit.subject) {
        var lc = el("span", "tlast", f.last_commit.subject);
        lc.setAttribute("data-role", "tree-last-commit");
        lc.setAttribute("title", lastCommitTitle(f.last_commit));
        b.appendChild(lc);
      }
      (function (entry) {
        b.addEventListener("click", function () { selectFile(entry); });
      })(f);
      container.appendChild(b);
    });
  }

  function selectFile(entry) {
    var path = entry.path;
    if (state.highlight === path) {
      state.highlight = null;
      renderList();
      renderWorkspaceTree();
      return;
    }
    state.highlight = path;
    var pend = entry.pending_cases || [];
    var hist = entry.history_cases || [];
    if (pend.length > 0) {
      setView("pending");
      renderList();
      renderWorkspaceTree();
      state.fileCommit = entry.last_commit || null;
      selectCase(pend[0]);
    } else if (hist.length > 0) {
      setView("history");
      renderList();
      renderWorkspaceTree();
      state.fileCommit = entry.last_commit || null;
      selectCase(hist[0]);
    } else {
      state.fileCommit = entry.last_commit || null;
      state.selected = null;
      state.selectedFiles = [];
      renderList();
      renderWorkspaceTree();
      renderDetailEmpty("이 파일에 걸린 건이 없습니다");
    }
  }

  function showError(msg) {
    var e = document.getElementById("err");
    if (e) e.textContent = msg;
  }

  function renderDetailLoading() {
    detailEl.textContent = "";
    detailEl.appendChild(el("div", "empty", "불러오는 중"));
  }

  function renderDetailEmpty(msg) {
    detailEl.textContent = "";
    detailEl.appendChild(el("div", "empty", msg));
  }

  // unified diff를 파일 단위로 나눈다. git 메타 헤더는 상태 판정에만 쓰고 버린다.
  function parseDiffSections(text) {
    var sections = [];
    var cur = null;
    function push() { if (cur) { sections.push(cur); cur = null; } }
    function blank() {
      return { a: "", b: "", hunks: [], added: 0, removed: 0, status: "modified" };
    }
    function hunkStart(line) {
      var m = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (!m) return null;
      return { oldStart: parseInt(m[1], 10), newStart: parseInt(m[2], 10) };
    }
    function feed(s, line) {
      if (line.indexOf("@@") === 0) {
        var st = hunkStart(line);
        s.hunks.push({ hunk: line, lines: [], oldStart: st ? st.oldStart : 1, newStart: st ? st.newStart : 1 });
        return;
      }
      if (s.hunks.length === 0) {
        if (/^new file mode/.test(line)) s.status = "added";
        else if (/^deleted file mode/.test(line)) s.status = "deleted";
        else if (/^rename (from|to) /.test(line)) s.status = "renamed";
        return;
      }
      if (line.charAt(0) === "\\") return;
      s.hunks[s.hunks.length - 1].lines.push(line);
      if (line.indexOf("+") === 0 && line.indexOf("+++") !== 0) s.added += 1;
      else if (line.indexOf("-") === 0 && line.indexOf("---") !== 0) s.removed += 1;
    }
    esc(text).split("\n").forEach(function (line) {
      if (line.indexOf("diff --git ") === 0) {
        push();
        cur = blank();
        var m = line.match(/^diff --git a\/(.*) b\/(.*)$/);
        if (m) { cur.a = m[1]; cur.b = m[2]; }
        return;
      }
      if (!cur) cur = blank();
      feed(cur, line);
    });
    push();
    // 빈 섹션(내용 없는 꼬리 등)은 버린다
    return sections.filter(function (s) {
      return s.hunks.length > 0 || s.added > 0 || s.removed > 0;
    });
  }

  function sectionPath(s, fallback, idx) {
    if (s.b) return s.b;
    if (s.a) return s.a;
    return (fallback && fallback[idx]) || ("파일 " + (idx + 1));
  }

  function countsText(s) {
    return "+" + s.added + "/-" + s.removed;
  }

  function renderCommitMessage(d) {
    if (!d.commit_message) return null;
    var box = el("div", "commitmsg", null);
    box.setAttribute("data-role", "commit-message");
    var label = d.status === "pending" ? "승인 시 커밋 메시지" : "커밋 메시지";
    box.appendChild(el("span", "cmlabel", label));
    var lines = String(d.commit_message).split("\n");
    box.appendChild(el("span", "cmfirst", lines[0] || ""));
    if (lines.length > 1) {
      box.appendChild(el("span", null, "\n" + lines.slice(1).join("\n")));
    }
    box.setAttribute("title", d.commit_message);
    return box;
  }

  function renderDecisionBar(d) {
    var bar = el("div", "decbar", null);
    bar.setAttribute("data-role", "decision-bar");
    var top = el("div", "decbar-top", null);
    top.appendChild(el("h2", null, d.case_id));
    top.appendChild(statusSpan(d.status));
    (d.stop_reasons || []).forEach(function (sig) { top.appendChild(badge(sig)); });
    top.appendChild(el("span", "risk", riskText(d.risk_score)));
    bar.appendChild(top);

    var req = el("p", "req1", d.request);
    bar.appendChild(req);
    var eff = el("p", "eff", d.effect_on_approve || "없음");
    eff.setAttribute("title", d.effect_on_approve || "없음");
    bar.appendChild(eff);

    if (state.fileCommit) {
      var fc = state.fileCommit;
      var sha7 = String(fc.sha).slice(0, 7);
      var line = el("p", "lastcommit", "마지막 커밋: " + (fc.subject || "") + " · " + sha7 + " · " + (fc.date || ""));
      line.setAttribute("title", lastCommitTitle(fc));
      bar.appendChild(line);
    }

    var cm = renderCommitMessage(d);
    if (cm) bar.appendChild(cm);

    if (d.status === "pending") {
      var draft = state.drafts[d.case_id];
      var row = el("div", "actrow", null);
      var note = el("input", null, null);
      note.id = "note";
      note.type = "text";
      note.value = (draft && draft.note) || "";
      note.setAttribute("placeholder", "반려할 때 사유를 입력하세요");
      note.setAttribute("aria-label", "반려 사유");
      row.appendChild(note);
      var ok = el("button", "btn btn-primary", null);
      ok.id = "approveBtn"; ok.type = "button";
      ok.setAttribute("aria-label", "승인");
      ok.setAttribute("aria-pressed", draft && draft.kind === "approve" ? "true" : "false");
      ok.appendChild(icon("check"));
      ok.appendChild(el("span", null, "승인"));
      var no = el("button", "btn btn-danger", null);
      no.id = "rejectBtn"; no.type = "button";
      no.setAttribute("aria-label", "반려");
      no.setAttribute("aria-pressed", draft && draft.kind === "reject" ? "true" : "false");
      no.appendChild(icon("x"));
      no.appendChild(el("span", null, "반려"));
      row.appendChild(ok); row.appendChild(no);
      bar.appendChild(row);
      var errDiv = el("div", null, null);
      errDiv.id = "err";
      bar.appendChild(errDiv);
      var draftLine = el("div", null, draft ? (draft.kind === "approve" ? "승인 예정으로 표시됨 — 다시 누르면 해제됩니다" : "반려 예정으로 표시됨 — 다시 누르면 해제됩니다") : "");
      draftLine.id = "draftline";
      bar.appendChild(draftLine);
      ok.addEventListener("click", function () {
        markDraft(d.case_id, "approve", note.value);
      });
      no.addEventListener("click", function () {
        markDraft(d.case_id, "reject", note.value);
      });
    } else {
      var dec = el("div", "decided", null);
      var bits = [];
      bits.push("결정 " + (STATUS_LABEL[d.status] || d.status));
      if (d.decision) bits.push("선택 " + d.decision);
      if (d.reviewer_note) bits.push("사유 " + d.reviewer_note);
      var span = el("span", null, bits.join(" · "));
      dec.appendChild(span);
      if (d.commit_sha) {
        dec.appendChild(document.createTextNode(" · "));
        var sha = el("span", "sha", "커밋 " + d.commit_sha);
        sha.setAttribute("title", d.commit_sha);
        dec.appendChild(sha);
      } else {
        dec.appendChild(document.createTextNode(" · 커밋 없음"));
      }
      bar.appendChild(dec);
    }
    return bar;
  }

  function renderSummary(d, sections) {
    var sec = el("section", null, null);
    sec.setAttribute("data-role", "summary");
    sec.appendChild(el("h3", null, "케이스 원인"));
    var reasons = el("ul", "rationale", null);
    if (!d.stop_reasons || d.stop_reasons.length === 0) {
      reasons.appendChild(el("li", null, "멈추지 않음 (자동 적용 대상)"));
    } else {
      (d.rationale || []).forEach(function (r) { reasons.appendChild(el("li", null, r)); });
      if (reasons.children.length === 0) {
        (d.stop_reasons || []).forEach(function (sig) {
          reasons.appendChild(el("li", null, SIGNAL_LABEL[sig] || sig));
        });
      }
    }
    sec.appendChild(reasons);
    sec.appendChild(el("p", null, d.test_passed ? "테스트 통과" : "테스트 실패"));
    var added = 0, removed = 0;
    sections.forEach(function (s) { added += s.added; removed += s.removed; });
    sec.appendChild(el("p", null,
      "파일 " + (d.files || []).length + "개 · +" + added + "/-" + removed));
    return sec;
  }

  function renderFileTree(body, sections, files) {
    var wrap = el("div", "filewrap", null);
    var tree = el("div", "tree", null);
    var diffs = el("div", "diffs", null);
    var groups = {};
    var order = [];
    sections.forEach(function (s, i) {
      var p = sectionPath(s, files, i);
      var slash = p.lastIndexOf("/");
      var dir = slash < 0 ? "(최상위)" : p.slice(0, slash);
      var name = slash < 0 ? p : p.slice(slash + 1);
      if (!groups[dir]) { groups[dir] = []; order.push(dir); }
      groups[dir].push({ sec: s, name: name, path: p, idx: i });
    });
    order.forEach(function (dir) {
      var det = el("details", null, null);
      det.open = true;
      var sum = el("summary", null, dir + " (" + groups[dir].length + ")");
      det.appendChild(sum);
      var ul = el("ul", null, null);
      groups[dir].forEach(function (f) {
        var li = el("li", null, null);
        var b = el("button", null, null);
        b.type = "button";
        b.setAttribute("data-file", f.path);
        b.appendChild(el("span", null, f.name + " "));
        b.appendChild(fileBadge(f.sec.status));
        b.appendChild(el("span", "counts", " " + countsText(f.sec)));
        b.addEventListener("click", function () {
          var t = document.getElementById("file-" + f.idx);
          if (!t) return;
          t.open = true;
          if (t.scrollIntoView) t.scrollIntoView();
        });
        li.appendChild(b);
        ul.appendChild(li);
        det.appendChild(ul);
      });
      tree.appendChild(det);
    });
    wrap.appendChild(tree);
    wrap.appendChild(diffs);
    return { wrap: wrap, diffs: diffs };
  }

  function diffstatBar(s) {
    var wrap = el("span", "db", null);
    wrap.setAttribute("title", "+" + s.added + " -" + s.removed);
    wrap.setAttribute("aria-hidden", "true");
    var total = s.added + s.removed;
    var green = total === 0 ? 0 : Math.round(s.added / total * 5);
    for (var i = 0; i < 5; i++) {
      wrap.appendChild(el("i", "cell" + (total === 0 ? "" : (i < green ? " g" : " r")), null));
    }
    return wrap;
  }

  function renderDiffBlock(sections, files, diffsEl, openByDefault) {
    sections.forEach(function (s, i) {
      var path = sectionPath(s, files, i);
      var det = el("details", "filediff", null);
      det.id = "file-" + i;
      det.setAttribute("data-role", "file-diff");
      det.setAttribute("data-path", path);
      det.open = openByDefault;
      var sum = el("summary", null, null);
      sum.appendChild(icon("chevronDown", "fchev"));
      sum.appendChild(el("span", "fpath", path + " "));
      sum.appendChild(fileBadge(s.status));
      var pm = el("span", "pm", null);
      pm.appendChild(el("span", "p", "+" + s.added + " "));
      pm.appendChild(el("span", "m", "−" + s.removed));
      sum.appendChild(pm);
      sum.appendChild(diffstatBar(s));
      det.appendChild(sum);
      var pre = el("pre", "diff", null);
      var table = document.createElement("table");
      table.className = "difftable";
      var tbody = document.createElement("tbody");
      s.hunks.forEach(function (h) {
        var hr = document.createElement("tr");
        hr.className = "hunk";
        var hc = document.createElement("td");
        hc.setAttribute("colspan", "3");
        hc.textContent = h.hunk;
        hr.appendChild(hc);
        tbody.appendChild(hr);
        var oldNo = h.oldStart, newNo = h.newStart;
        h.lines.forEach(function (line) {
          var cls = "ctx", o = "", n = "";
          if (line.indexOf("+") === 0 && line.indexOf("+++") !== 0) {
            cls = "add"; n = String(newNo); newNo += 1;
          } else if (line.indexOf("-") === 0 && line.indexOf("---") !== 0) {
            cls = "del"; o = String(oldNo); oldNo += 1;
          } else {
            o = String(oldNo); n = String(newNo); oldNo += 1; newNo += 1;
          }
          var tr = document.createElement("tr");
          tr.className = cls;
          var tdO = document.createElement("td");
          tdO.className = "ln";
          tdO.textContent = o;
          var tdN = document.createElement("td");
          tdN.className = "ln";
          tdN.textContent = n;
          var tdC = document.createElement("td");
          tdC.className = "code";
          tdC.textContent = line;
          tr.appendChild(tdO); tr.appendChild(tdN); tr.appendChild(tdC);
          tbody.appendChild(tr);
        });
      });
      table.appendChild(tbody);
      pre.appendChild(table);
      det.appendChild(pre);
      diffsEl.appendChild(det);
    });
  }

  function renderFilesSection(d, sections) {
    var sec = el("section", null, null);
    sec.appendChild(el("h3", null, "변경 파일"));
    var total = 0;
    sections.forEach(function (s) { total += s.added + s.removed; });
    var openByDefault = total <= EXPAND_LIMIT;
    var parts = renderFileTree(sec, sections, d.files || []);
    sec.appendChild(parts.wrap);
    renderDiffBlock(sections, d.files || [], parts.diffs, openByDefault);
    return sec;
  }

  function renderDetail(d) {
    detailEl.textContent = "";
    detailEl.appendChild(renderDecisionBar(d));
    var body = el("div", "detailbody", null);
    var sections = parseDiffSections(d.diff || "");
    body.appendChild(renderSummary(d, sections));
    body.appendChild(renderFilesSection(d, sections));
    detailEl.appendChild(body);
  }

  function setBusy(b) {
    state.busy = b;
    renderRunAll();
    renderSubmitBtn();
    ["approveBtn", "rejectBtn"].forEach(function (id) {
      var n = document.getElementById(id);
      if (n) n.disabled = b;
    });
    var note = document.getElementById("note");
    if (note) note.disabled = b;
  }

  function markDraft(caseId, kind, note) {
    showError("");
    var cur = state.drafts[caseId];
    if (cur && cur.kind === kind) {
      delete state.drafts[caseId];
      persistDrafts();
      renderList();
      renderSubmitBtn();
      selectCase(caseId);
      return;
    }
    if (kind === "reject" && (!note || note.trim() === "")) {
      showError("반려 표시에는 사유가 필요합니다. 사유를 입력한 뒤 다시 눌러주세요");
      return;
    }
    state.drafts[caseId] = { kind: kind, note: kind === "reject" ? note : (note || "") };
    persistDrafts();
    renderList();
    renderSubmitBtn();
    var pendingIds = pendingCases().map(function (c) { return c.case_id; });
    var idx = pendingIds.indexOf(caseId);
    var next = pendingIds[idx + 1] || pendingIds[idx];
    if (next && next !== caseId) selectCase(next);
    else selectCase(caseId);
  }

  function openSubmitModal() {
    pruneDrafts();
    var ids = draftIds();
    if (ids.length === 0) return;
    modalOverlay.textContent = "";
    var box = el("div", "submitmodal", null);
    box.setAttribute("data-role", "submit-modal");
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-label", "결정 제출 확인");
    box.appendChild(el("h2", null, "결정 제출"));
    var body = el("div", "mbody", null);
    var commits = state.stats ? state.stats.sandbox_commits : 0;
    var approves = ids.filter(function (id) { return state.drafts[id].kind === "approve"; });
    var rejects = ids.filter(function (id) { return state.drafts[id].kind === "reject"; });
    if (approves.length > 0) {
      body.appendChild(el("h3", null, "승인 예정 " + approves.length + "건"));
      approves.forEach(function (id) {
        var c = caseById(id);
        var item = el("div", "mitem", null);
        item.appendChild(el("span", "cid", id + " "));
        item.appendChild(el("span", null, c ? c.request : ""));
        item.appendChild(el("div", "cmeta", "sandbox 커밋 +1 · 현재 " + commits));
        body.appendChild(item);
      });
    }
    if (rejects.length > 0) {
      body.appendChild(el("h3", null, "반려 예정 " + rejects.length + "건"));
      rejects.forEach(function (id) {
        var c = caseById(id);
        var item = el("div", "mitem", null);
        item.appendChild(el("span", "cid", id + " "));
        item.appendChild(el("span", null, c ? c.request : ""));
        item.appendChild(el("div", "cmeta", "사유: " + state.drafts[id].note));
        body.appendChild(item);
      });
    }
    body.appendChild(el("p", "warn", "제출하면 되돌릴 수 없습니다"));
    var result = el("div", null, null);
    result.setAttribute("data-role", "submit-result");
    body.appendChild(result);
    box.appendChild(body);
    var foot = el("div", "mfoot", null);
    var cancel = el("button", "btn", "취소");
    cancel.type = "button";
    cancel.addEventListener("click", function () {
      modalOverlay.setAttribute("hidden", "");
      modalOverlay.textContent = "";
    });
    var confirm = el("button", "btn btn-primary", "제출");
    confirm.type = "button";
    confirm.setAttribute("data-role", "submit-confirm");
    confirm.addEventListener("click", function () {
      submitAll(result, foot, cancel, confirm);
    });
    foot.appendChild(cancel);
    foot.appendChild(confirm);
    box.appendChild(foot);
    modalOverlay.appendChild(box);
    modalOverlay.removeAttribute("hidden");
  }

  function submitAll(resultEl, footEl, cancelBtn, confirmBtn) {
    state.submitBusy = true;
    renderSubmitBtn();
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    resultEl.textContent = "";
    var ids = draftIds();
    var chain = Promise.resolve();
    var outcomes = [];
    ids.forEach(function (id) {
      chain = chain.then(function () {
        var draft = state.drafts[id];
        if (!draft) return;
        var path = "/api/cases/" + encodeURIComponent(id) + "/" + draft.kind;
        var payload = draft.kind === "reject"
          ? { note: draft.note }
          : (draft.note ? { note: draft.note } : {});
        return api(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function () {
          delete state.drafts[id];
          outcomes.push({ id: id, ok: true });
        }).catch(function (e) {
          outcomes.push({ id: id, ok: false, error: e.message });
        });
      });
    });
    chain.then(function () {
      persistDrafts();
      outcomes.forEach(function (o) {
        var row = el("div", "mresult", null);
        row.appendChild(el("span", "cid", o.id + " "));
        if (o.ok) row.appendChild(el("span", "ok", "성공"));
        else {
          row.appendChild(el("span", "fail", "실패"));
          row.appendChild(el("span", null, " — " + (o.error || "")));
        }
        resultEl.appendChild(row);
      });
      return refresh();
    }).then(function () {
      renderSubmitBtn();
      var np = pendingCases().map(function (c) { return c.case_id; });
      if (state.selected && np.indexOf(state.selected) >= 0) selectCase(state.selected);
      else if (np.length > 0) selectCase(np[0]);
      else {
        state.selected = null;
        renderDetailEmpty("대기 중인 건이 없습니다");
      }
    }).then(function () {
      state.submitBusy = false;
      renderSubmitBtn();
      footEl.textContent = "";
      var close = el("button", "btn", "닫기");
      close.type = "button";
      close.addEventListener("click", function () {
        modalOverlay.setAttribute("hidden", "");
        modalOverlay.textContent = "";
      });
      footEl.appendChild(close);
    });
  }

  function selectCase(caseId) {
    state.selected = caseId;
    renderList();
    renderWorkspaceTree();
    renderDetailLoading();
    api("/api/cases/" + encodeURIComponent(caseId)).then(function (d) {
      if (state.selected === caseId) {
        state.selectedFiles = d.files || [];
        renderDetail(d);
        renderWorkspaceTree();
      }
    }).catch(function (e) {
      if (state.selected === caseId) renderDetailEmpty(e.message);
    });
  }

  function stepSelection(delta) {
    var rows = (state.view === "pending" ? pendingCases() : historyCases())
      .map(function (c) { return c.case_id; });
    if (rows.length === 0) return;
    var i = rows.indexOf(state.selected);
    if (i < 0) i = delta > 0 ? 0 : rows.length - 1;
    else i = Math.min(rows.length - 1, Math.max(0, i + delta));
    state.fileCommit = null;
    selectCase(rows[i]);
  }

  document.addEventListener("keydown", function (e) {
    if (!modalOverlay.hasAttribute("hidden")) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.key === "j") stepSelection(1);
    else if (e.key === "k") stepSelection(-1);
  });

  function setPanelCollapsed(collapsed) {
    state.collapsed = collapsed;
    panelEl.setAttribute("data-collapsed", collapsed ? "true" : "false");
    panelToggle.textContent = "";
    panelToggle.appendChild(icon(collapsed ? "sidebarExpand" : "sidebarCollapse"));
    panelToggle.setAttribute("aria-label", collapsed ? "패널 펼치기" : "패널 접기");
    panelToggle.setAttribute("title", collapsed ? "패널 펼치기" : "패널 접기");
    if (collapsed) {
      panelVLabel.textContent = "대기 " + pendingCases().length;
      panelVLabel.removeAttribute("hidden");
    } else {
      panelVLabel.setAttribute("hidden", "");
    }
    lsSet(PANEL_KEY, collapsed ? "1" : "0");
  }

  function setView(v) {
    state.view = v;
    tabPending.setAttribute("aria-selected", v === "pending" ? "true" : "false");
    tabHistory.setAttribute("aria-selected", v === "history" ? "true" : "false");
    renderList();
  }

  function refresh() {
    return api("/api/stats").then(function (s) {
      state.stats = s;
      renderStats();
      return api("/api/cases");
    }).then(function (cases) {
      state.cases = cases;
      pruneDrafts();
      renderList();
      renderSubmitBtn();
      return api("/api/tree").then(function (t) {
        state.tree = t;
      }).catch(function () {
        state.tree = [];
      });
    }).then(function () {
      renderList();
      renderWorkspaceTree();
      if (state.collapsed) setPanelCollapsed(true);
    }).catch(function (e) {
      statsEl.textContent = e.message;
    });
  }

  runAllBtn.appendChild(icon("sync"));
  runAllBtn.appendChild(el("span", null, "새 산출물 가져오기"));
  runAllBtn.addEventListener("click", function () {
    setBusy(true);
    api("/api/run-all", { method: "POST" }).then(function (s) {
      state.stats = s;
      renderStats();
      return api("/api/cases");
    }).then(function (cases) {
      state.cases = cases;
      pruneDrafts();
      renderList();
      renderSubmitBtn();
      return api("/api/tree").then(function (t) {
        state.tree = t;
      }).catch(function () {
        state.tree = [];
      });
    }).then(function () {
      state.selected = null;
      state.highlight = null;
      state.fileCommit = null;
      renderList();
      renderWorkspaceTree();
      renderDetailEmpty("목록에서 건을 선택하세요");
    }).catch(function (e) {
      statsEl.textContent = e.message;
    }).then(function () { setBusy(false); });
  });

  submitBtn.addEventListener("click", function () {
    openSubmitModal();
  });

  panelToggle.addEventListener("click", function () {
    setPanelCollapsed(!state.collapsed);
  });

  tabPending.addEventListener("click", function () { setView("pending"); });
  tabHistory.addEventListener("click", function () { setView("history"); });

  loadDrafts();
  setPanelCollapsed(lsGet(PANEL_KEY) === "1");
  renderDetailEmpty("목록에서 건을 선택하세요");
  refresh();
})();
</script>
</body>
</html>
